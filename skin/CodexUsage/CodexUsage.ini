[Rainmeter]
Update=5000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
DragMargin=1
OnRefreshAction=[!CommandMeasure MeasureRunPoll "Run"]
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureRunPoll "Run"]
LeftMouseUpAction=[!CommandMeasure MeasureRunPoll "Run"]

[Metadata]
Name=Codex Usage
Author=Noppadol
Version=1.0
Description=Codex quota used, read through the official Codex app-server. Click to refresh. Automatic refresh every five minutes while loaded.
License=MIT

[Variables]
StatusFile=#@#usage_status.txt
PollScript=#@#poll_usage.ps1
BGColor=24,22,30,235
NeutralColor=160,160,175,255
GreenColor=95,200,130,255
YellowColor=235,190,70,255
RedColor=235,90,90,255
TextColor=235,232,240,255
DimColor=150,146,160,255
BarBGColor=55,50,65,255
W=250
BarH=8

GreenMax=80
YellowMax=90

[MeasureRunPoll]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#PollScript#"
State=Hide
UpdateDivider=60
Hidden=1
OnUpdateAction=[!CommandMeasure MeasureRunPoll "Run"]
FinishAction=[!UpdateMeasure MeasureData][!UpdateMeterGroup Data][!Redraw]

[MeasureData]
Measure=WebParser
Url=file:///#StatusFile#
RegExp=(?siU)FIVE_H=(.*)\nFIVE_H_RESET=(.*)\nSEVEN_D=(.*)\nSEVEN_D_RESET=(.*)\nUPDATED=(.*)\nSTATUS=(.*)\nNOTE=(.*)
UpdateRate=1
FinishAction=[!UpdateMeterGroup Data]

[MeasureFiveH]
Measure=WebParser
Url=[MeasureData]
StringIndex=1
Substitute="":"--"
MinValue=0
MaxValue=100
IfCondition=MeasureFiveH >= #YellowMax#
IfTrueAction=[!SetOption MeterFiveHBar BarColor "#RedColor#"][!SetOption MeterFiveHPercent FontColor "#RedColor#"][!UpdateMeter MeterFiveHBar][!UpdateMeter MeterFiveHPercent][!Redraw]
IfCondition2=(MeasureFiveH >= #GreenMax#) && (MeasureFiveH < #YellowMax#)
IfTrueAction2=[!SetOption MeterFiveHBar BarColor "#YellowColor#"][!SetOption MeterFiveHPercent FontColor "#YellowColor#"][!UpdateMeter MeterFiveHBar][!UpdateMeter MeterFiveHPercent][!Redraw]
IfCondition3=MeasureFiveH < #GreenMax#
IfTrueAction3=[!SetOption MeterFiveHBar BarColor "#GreenColor#"][!SetOption MeterFiveHPercent FontColor "#GreenColor#"][!UpdateMeter MeterFiveHBar][!UpdateMeter MeterFiveHPercent][!Redraw]

[MeasureFiveHReset]
Measure=WebParser
Url=[MeasureData]
StringIndex=2
Substitute="":"unknown"

[MeasureSevenD]
Measure=WebParser
Url=[MeasureData]
StringIndex=3
Substitute="":"--"
MinValue=0
MaxValue=100
IfCondition=MeasureSevenD >= #YellowMax#
IfTrueAction=[!SetOption MeterSevenDBar BarColor "#RedColor#"][!SetOption MeterSevenDPercent FontColor "#RedColor#"][!UpdateMeter MeterSevenDBar][!UpdateMeter MeterSevenDPercent][!Redraw]
IfCondition2=(MeasureSevenD >= #GreenMax#) && (MeasureSevenD < #YellowMax#)
IfTrueAction2=[!SetOption MeterSevenDBar BarColor "#YellowColor#"][!SetOption MeterSevenDPercent FontColor "#YellowColor#"][!UpdateMeter MeterSevenDBar][!UpdateMeter MeterSevenDPercent][!Redraw]
IfCondition3=MeasureSevenD < #GreenMax#
IfTrueAction3=[!SetOption MeterSevenDBar BarColor "#GreenColor#"][!SetOption MeterSevenDPercent FontColor "#GreenColor#"][!UpdateMeter MeterSevenDBar][!UpdateMeter MeterSevenDPercent][!Redraw]

[MeasureSevenDReset]
Measure=WebParser
Url=[MeasureData]
StringIndex=4
Substitute="":"unknown"

[MeasureUpdated]
Measure=WebParser
Url=[MeasureData]
StringIndex=5
Substitute="":"never"

[MeasureStatus]
Measure=WebParser
Url=[MeasureData]
StringIndex=6
Substitute="":"UNKNOWN"
IfMatch=^OK$
IfMatchAction=[!SetOption MeterStatusDot Shape "Ellipse (#W#-26),22,5,5 | Fill Color #GreenColor# | StrokeWidth 0"]
IfNotMatchAction=[!SetOption MeterStatusDot Shape "Ellipse (#W#-26),22,5,5 | Fill Color #RedColor# | StrokeWidth 0"]

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#W#,134,10 | Fill Color #BGColor# | StrokeWidth 0
Group=Data

[MeterLabel]
Meter=String
MeterStyle=StyleLabel
X=18
Y=12
Text=Codex Usage
Group=Data

[MeterStatusDot]
Meter=Shape
Shape=Ellipse (#W#-26),22,5,5 | Fill Color #NeutralColor# | StrokeWidth 0
ToolTipText=Used quota | Last success: [MeasureUpdated] | [MeasureStatus]
DynamicVariables=1
Group=Data

[MeterFiveHCaption]
Meter=String
MeterStyle=StyleTiny
X=18
Y=40
Text=5-HOUR
Group=Data

[MeterFiveHPercent]
Meter=String
MeterStyle=StyleSmall
X=(#W#-18)
Y=36
StringAlign=Right
Text=%1%
MeasureName=MeasureFiveH
Group=Data

[MeterFiveHBarBG]
Meter=Shape
Shape=Rectangle 18,57,(#W#-36),#BarH#,3 | Fill Color #BarBGColor# | StrokeWidth 0
Group=Data

[MeterFiveHBar]
Meter=Bar
X=18
Y=57
W=(#W#-36)
H=#BarH#
BarColor=#GreenColor#
BarOrientation=Horizontal
MeasureName=MeasureFiveH
Group=Data

[MeterFiveHResetText]
Meter=String
MeterStyle=StyleTiny
X=18
Y=68
Text=resets in %1
MeasureName=MeasureFiveHReset
Group=Data

[MeterSevenDCaption]
Meter=String
MeterStyle=StyleTiny
X=18
Y=88
Text=7-DAY
Group=Data

[MeterSevenDPercent]
Meter=String
MeterStyle=StyleSmall
X=(#W#-18)
Y=84
StringAlign=Right
Text=%1%
MeasureName=MeasureSevenD
Group=Data

[MeterSevenDBarBG]
Meter=Shape
Shape=Rectangle 18,105,(#W#-36),#BarH#,3 | Fill Color #BarBGColor# | StrokeWidth 0
Group=Data

[MeterSevenDBar]
Meter=Bar
X=18
Y=105
W=(#W#-36)
H=#BarH#
BarColor=#GreenColor#
BarOrientation=Horizontal
MeasureName=MeasureSevenD
Group=Data

[MeterSevenDResetText]
Meter=String
MeterStyle=StyleTiny
X=18
Y=116
Text=resets in %1
MeasureName=MeasureSevenDReset
Group=Data

[StyleLabel]
FontFace=Segoe UI
FontSize=9
FontColor=#DimColor#
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[StyleSmall]
FontFace=Segoe UI
FontSize=13
FontColor=#TextColor#
StringStyle=Bold
AntiAlias=1

[StyleTiny]
FontFace=Segoe UI
FontSize=8
FontColor=#DimColor#
AntiAlias=1